name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  # Worker tests gate the site deploy. The worker itself is NOT deployed
  # automatically here — no Cloudflare API token secret exists in this repo.
  worker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Sync data
        run: npm run sync-data
        working-directory: worker

      - name: Test worker
        run: npx vitest run
        working-directory: worker

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: worker-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        run: npm run build
        env:
          REACT_APP_CHAT_WORKER_URL: ${{ secrets.CHAT_WORKER_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOREN_LARSEN }}
          channelId: live
          projectId: soren-larsen
